name: Pretrained parent metadata probe

# Explicitly opt in via a commit message marker; ordinary CI never downloads weights.
on:
  push:

permissions:
  contents: read
  pull-requests: write

jobs:
  metadata:
    if: contains(github.event.head_commit.message, '[parent-probe]')
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install huggingface-hub==0.36.2
      - name: Inspect immutable model metadata and license documents
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pretrained_probe.py --out artifacts/parent-probe.json --post-pr 1
      - uses: actions/upload-artifact@v4
        with:
          name: parent-metadata-evidence
          path: artifacts/parent-probe.json
