name: Real pretrained matched-control language diagnosis

on:
  push:

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnostic:
    if: contains(github.event.head_commit.message, '[language-diagnostic]')
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Restore real child, train matched control and score fresh language windows
        id: diagnostic
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/run_language_diagnostic.py --out artifacts/language-diagnostic --post-pr 1
      - name: Publish partial evidence if interrupted
        if: always() && steps.diagnostic.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_study_evidence.py --out artifacts/language-diagnostic --post-pr 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: language-diagnostic-evidence
          path: |
            artifacts/language-diagnostic/*.json
            artifacts/language-diagnostic/*.jsonl
            artifacts/language-diagnostic/observations/
            artifacts/language-diagnostic/fresh-reference/results.json
            artifacts/language-diagnostic/reference-v2/reference.json
          # No original/frozen model weights or duplicate new-interface binary uploads.
