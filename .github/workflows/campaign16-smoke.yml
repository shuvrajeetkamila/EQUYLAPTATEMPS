name: Campaign 16 smoke
"on":
  push:
    branches: [arena/97efdf4a-equylaptatemps]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: campaign16-smoke
  cancel-in-progress: false
jobs:
  panel:
    if: contains(github.event.head_commit.message, '[campaign16-smoke]')
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.3 safetensors==0.5.2 sentencepiece==0.2.0 numpy==2.2.6
      - name: Campaign 16 smoke runs
        id: research
        env:
          PYTHONPATH: src:scripts
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          HF_HUB_DISABLE_TELEMETRY: "1"
          GH_TOKEN: ${{ github.token }}
        run: python scripts/campaign16_runner.py --registry campaigns/campaign_16/experiment_registry_smoke.json --out campaigns/campaign_16/smoke_out --post-pr 1
      - name: Publish partial metadata
        if: always() && steps.research.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src:scripts
        run: python scripts/publish_campaign02.py --out campaigns/campaign_16/smoke_out --post-pr 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign16-smoke
          path: campaigns/campaign_16/smoke_out
          retention-days: 3
