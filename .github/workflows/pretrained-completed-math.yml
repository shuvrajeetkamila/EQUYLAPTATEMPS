name: Real pretrained completed-answer mathematics

on:
  push:

permissions:
  contents: read
  pull-requests: write

jobs:
  math:
    if: contains(github.event.head_commit.message, '[completed-math]')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Validate native caches and evaluate genuine parents and unchanged child
        id: math
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/run_completed_math.py --config configs/pretrained-completed-math-validated.json --out artifacts/completed-math --post-pr 1
      - name: Preserve partial records if interrupted
        if: always() && steps.math.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_study_evidence.py --out artifacts/completed-math --post-pr 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completed-math-evidence
          path: |
            artifacts/completed-math/*.json
            artifacts/completed-math/*.jsonl
            artifacts/completed-math/observations/
          # Never include private-child, frozen original weights, or raw datasets.
