name: Campaign 8 stageEcal

on:
  push:

permissions:
  contents: read
  pull-requests: write

jobs:
  run:
    if: contains(github.event.head_commit.message, '[campaign08-stageEcal]')
    runs-on: ubuntu-22.04
    timeout-minutes: 200
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Run Campaign 8 stageEcal
        id: research
        timeout-minutes: 190
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/campaign08_runner.py --registry campaigns/campaign_08/experiment_registry_stageE_cal96.json --out artifacts/campaign08-stageEcal --post-pr 1
      - name: Publish partial research metadata
        if: always() && steps.research.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_campaign02.py --out artifacts/campaign08-stageEcal --post-pr 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign08-stageEcal-recovery
          path: artifacts/campaign08-stageEcal/
