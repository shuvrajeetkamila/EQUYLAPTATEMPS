name: Campaign 13 probe

on:
  push:

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[campaign13-probe]')
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Run Campaign 13 probe phase
        id: research
        timeout-minutes: 110
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/campaign13_probe.py --out artifacts/campaign13-probe --post-pr 1
      - name: Publish partial research metadata
        if: always() && steps.research.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_campaign02.py --out artifacts/campaign13-probe --post-pr 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign13-probe-recovery
          path: artifacts/campaign13-probe/
