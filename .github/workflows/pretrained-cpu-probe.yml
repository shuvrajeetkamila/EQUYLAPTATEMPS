name: Real pretrained CPU structural probe

# Separate explicit opt-in. Standard CI never downloads parent weights.
on:
  push:

permissions:
  contents: read
  pull-requests: write

jobs:
  real-parents:
    if: contains(github.event.head_commit.message, '[pretrained-cpu-probe]')
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install the audited CPU runtime
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Download pinned real parents and check integrated child
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/run_pretrained_cpu_probe.py --out artifacts/pretrained-cpu --post-pr 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pretrained-cpu-lightweight-evidence
          path: |
            artifacts/pretrained-cpu/results.json
            artifacts/pretrained-cpu/recipe.json
            artifacts/pretrained-cpu/sector-inventory.json
            artifacts/pretrained-cpu/calibration.jsonl
            artifacts/pretrained-cpu/calibration-report.json
            artifacts/pretrained-cpu/fresh-process/check.json
            artifacts/pretrained-cpu/reference-child/
          # Never include frozen parent tensors, raw datasets, or private-child weights.
