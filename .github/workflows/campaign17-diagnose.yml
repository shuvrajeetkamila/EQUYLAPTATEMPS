name: Campaign 17 native-depth placement diagnostics
"on":
  push:
    branches: [arena/97efdf4a-equylaptatemps]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: campaign17-diagnose
  cancel-in-progress: false
jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[campaign17-diagnose]')
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.3 safetensors==0.5.2 sentencepiece==0.2.0 numpy==2.2.6
      - name: Reconstruction diagnostics
        id: research
        env:
          PYTHONPATH: src:scripts
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          HF_HUB_DISABLE_TELEMETRY: "1"
          PYTHONUNBUFFERED: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/campaign17_diagnose.py --out campaigns/campaign_17/diagnostics_out --post-pr 1 2>&1 | tee diag.log
          code=${PIPESTATUS[0]}
          echo "diagnose exit code: $code" >> diag.log
          exit $code
      - name: Publish partial diagnostics metadata
        if: always() && steps.research.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src:scripts
        run: python scripts/publish_campaign02.py --out campaigns/campaign_17/diagnostics_out --post-pr 1
      - name: Post failure log tail
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Campaign 17 diagnose failure (run ${{ github.run_id }}). Log tail:"; echo '```'; tail -c 6000 diag.log 2>/dev/null || echo "no diag.log"; echo '```'; } > failure_comment.md
          python3 - <<'PYEOF'
          import json, os, urllib.request
          body = open("failure_comment.md").read()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/1/comments",
              data=json.dumps({"body": body}).encode(),
              method="POST",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print("failure comment posted", response.status)
          PYEOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign14-diagnostics
          path: campaigns/campaign_17/diagnostics_out
          retention-days: 3
