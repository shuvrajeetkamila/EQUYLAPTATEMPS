name: Campaign 2 sequential representation alignment

on:
  push:

permissions:
  contents: read
  pull-requests: write

jobs:
  alignment:
    if: contains(github.event.head_commit.message, '[campaign02-align]')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Run immutable sequential development matrix
        id: research
        timeout-minutes: 55
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/campaign02_align.py --out artifacts/campaign02-align --post-pr 1
      - name: Publish partial research metadata
        if: always() && steps.research.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_campaign02.py --out artifacts/campaign02-align --post-pr 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign02-alignment-recovery
          path: artifacts/campaign02-align/
          # This directory contains only new-parameter/optimizer states and metadata,
          # never original parent or standalone/frozen child checkpoint files.
