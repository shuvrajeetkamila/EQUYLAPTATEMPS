name: Real pretrained controlled CPU pilot

on:
  push:

permissions:
  contents: read
  pull-requests: write

jobs:
  heldout-pilot:
    if: contains(github.event.head_commit.message, '[pretrained-pilot]')
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Execute real baselines, surgery, calibration, and held-out controls
        id: study
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/run_pretrained_study.py --cpu-pilot --out artifacts/pretrained-study --post-pr 1
      - name: Preserve partial records after failure/interruption
        if: always() && steps.study.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_study_evidence.py --out artifacts/pretrained-study --post-pr 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pretrained-controlled-pilot
          path: |
            artifacts/pretrained-study/*.json
            artifacts/pretrained-study/*.jsonl
            artifacts/pretrained-study/observations/
            artifacts/pretrained-study/fresh-process/check.json
            artifacts/pretrained-study/reference-child/
          # Never upload frozen parents, private-child, or raw WikiText data.
