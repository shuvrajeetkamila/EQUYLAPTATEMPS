name: Campaign 7 replication

on:
  push:

permissions:
  contents: read
  pull-requests: write

jobs:
  replication:
    if: contains(github.event.head_commit.message, '[campaign07-replication]')
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Run Campaign 7 replication phase
        id: research
        timeout-minutes: 140
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/campaign07_runner.py --registry campaigns/campaign_07/experiment_registry_replication.json --out artifacts/campaign07-replication --post-pr 1
      - name: Publish partial research metadata
        if: always() && steps.research.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_campaign02.py --out artifacts/campaign07-replication --post-pr 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign07-replication-recovery
          path: artifacts/campaign07-replication/
