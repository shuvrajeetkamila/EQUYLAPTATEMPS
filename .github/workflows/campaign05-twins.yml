name: Campaign 5 twins

on:
  push:

permissions:
  contents: read
  pull-requests: write

jobs:
  twins:
    if: contains(github.event.head_commit.message, '[campaign05-twins]')
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Run Campaign 5 twins phase
        id: research
        timeout-minutes: 65
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/campaign05_runner.py --registry campaigns/campaign_05/experiment_registry_twins.json --out artifacts/campaign05-twins --post-pr 1
      - name: Publish partial research metadata
        if: always() && steps.research.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_campaign02.py --out artifacts/campaign05-twins --post-pr 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign05-twins-recovery
          path: artifacts/campaign05-twins/
