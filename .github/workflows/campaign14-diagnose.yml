name: Campaign 14 reconstruction diagnostics
"on":
  push:
    branches: [arena/97efdf4a-equylaptatemps]
permissions:
  contents: read
  issues: write
concurrency:
  group: campaign14-diagnose
  cancel-in-progress: false
jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[campaign14-diagnose]')
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.3 safetensors==0.5.2 sentencepiece==0.2.0 numpy==2.2.6
      - name: Reconstruction diagnostics
        env:
          PYTHONPATH: src:scripts
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          HF_HUB_DISABLE_TELEMETRY: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python scripts/campaign14_diagnose.py --out campaigns/campaign_14/diagnostics_out --post-pr 1 2>&1 | tee diag.log
          code=${PIPESTATUS[0]}
          echo "diagnose exit code: $code" >> diag.log
          exit $code
      - name: Post failure log tail
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Campaign 14 diagnose failure (run ${{ github.run_id }}). Log tail:"; echo '```'; tail -c 6000 diag.log 2>/dev/null || echo "no diag.log"; echo '```'; } > failure_comment.md
          gh issue comment 1 --body-file failure_comment.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign14-diagnostics
          path: campaigns/campaign_14/diagnostics_out
          retention-days: 3
