name: Campaign 13 selftest

on:
  push:

permissions:
  contents: read
  pull-requests: write

jobs:
  selftest:
    if: contains(github.event.head_commit.message, '[campaign13-selftest]')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Run Campaign 13 selftest phase
        id: research
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/campaign13_runner.py --registry campaigns/campaign_13/experiment_registry_self.json --out artifacts/campaign13-selftest --post-pr 1
      - name: Publish partial research metadata
        if: always() && steps.research.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_campaign02.py --out artifacts/campaign13-selftest --post-pr 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign13-selftest-recovery
          path: artifacts/campaign13-selftest/
