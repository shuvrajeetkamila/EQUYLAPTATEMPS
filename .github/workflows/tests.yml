name: Offline surgery checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.11']
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Test native architecture surgery offline
        run: pytest -q --junitxml=artifacts/pytest-results.xml
      - name: Calibrate and reload a synthetic child
        run: equylaptatemps demo --out artifacts/ci-child --report artifacts/ci-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-audit-py${{ matrix.python }}
          path: |
            artifacts/pytest-results.xml
            artifacts/ci-smoke.json
