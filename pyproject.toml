[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equylaptatemps"
version = "0.1.0"
description = "Auditable whole-block surgery between unrelated Mamba and Qwen2 models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "torch>=2.5.1,<2.6",
    "transformers==4.48.3",
    "huggingface-hub>=0.36.2,<1.0",
    "safetensors>=0.5.2,<0.9",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[project.scripts]
equylaptatemps = "equylaptatemps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
